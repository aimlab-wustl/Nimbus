[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-ising"
version = "1.0.0"
description = "NIMBUS, neuromorphic Ising machine with block updates of spins: higher-order Ising machine with programmable multi-spin moves; compiler, event-driven emulation, CPU/GPU backends"
requires-python = ">=3.10"
authors = [{ name = "Faiek Ahsan" }]
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "numba>=0.59,<0.70",
  "pyyaml>=6,<7",
  "pyarrow>=14",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13,<15"]
plot = ["matplotlib>=3.7", "pandas>=2"]
test = ["pytest>=7"]
dev = ["pytest>=7", "matplotlib>=3.7", "pandas>=2"]
docs = ["mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26", "mkdocs-jupyter>=0.25"]
refs = ["pymatching>=2.4,<2.5", "ldpc>=2.4,<2.5", "stim>=1.12", "qecsim>=1.0b9"]

[project.scripts]
nimbus = "nimbus.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nimbus" = ["backends/kernels/*.cuh", "backends/kernels/*.cu", "data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "quick: offline deterministic checks (default suite)",
  "acceptance: bounded complete pipelines",
  "public_smoke: needs downloaded public instances under the data root",
  "gpu: needs a CUDA device (never silently skipped as passed; reported as not executed)",
  "slow: longer than a few seconds",
]
